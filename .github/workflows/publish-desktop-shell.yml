name: Publish desktop-shell to npm

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
    paths:
      - "desktop-shell/**"
      - ".github/workflows/publish-desktop-shell.yml"

permissions:
  contents: read

concurrency:
  group: publish-desktop-shell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"
      - run: npm ci
      - run: npm pack --dry-run
      - name: Read package metadata
        id: pkg
        run: |
          echo "name=$(node -p 'require(\"./package.json\").name')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
      - name: Check if version exists on npm
        id: npm_lookup
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.npm_lookup.outputs.exists != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skip when version already published
        if: steps.npm_lookup.outputs.exists == 'true'
        run: echo "Version ${{ steps.pkg.outputs.version }} of ${{ steps.pkg.outputs.name }} is already published."
